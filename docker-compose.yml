version: '3.8'

services:
  attendance-system:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mohammed-zaahid-yassin/attendance-system:latest
    container_name: mvjce-spotlight-attendance
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/attendance.db
      - REGISTRATION_KEY=${REGISTRATION_KEY:-STATIC_REG_QR_KEY_SECRET_7890}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-22Mon08Aug2005}
      - JWT_SECRET=${JWT_SECRET:-spotlight_mvjce_production_secret_key_2026}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}
    volumes:
      # Persistent SQLite storage volume on host machine
      - ./attendance_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
