# Render Infrastructure as Code Blueprint
# Configures persistent disk storage so SQLite data and admin credentials survive sleep/wake cycles & redeployments.
services:
  - type: web
    name: attendance-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    disk:
      name: attendance_data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /var/data/attendance.db
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_KEY
        value: STATIC_REG_QR_KEY_SECRET_7890
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
